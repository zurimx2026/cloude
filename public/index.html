<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161D">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2312161D'/%3E%3Ccircle cx='50' cy='56' r='30' fill='none' stroke='%235AB3B0' stroke-width='7'/%3E%3Cline x1='50' y1='56' x2='68' y2='40' stroke='%23F1EDE4' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='56' r='4' fill='%23F1EDE4'/%3E%3C/svg%3E">
<title>Panel — Control diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161D;
    --panel:#1B212B;
    --panel-alt:#222A36;
    --stroke:#2C3542;
    --text:#F1EDE4;
    --muted:#8891A0;
    --ok:#4FA87C;
    --warn:#E3A94D;
    --danger:#DD5B4F;
    --accent:#5AB3B0;
    --needle:#F1EDE4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2029 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 100px;}

  /* Header */
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;padding-top:6px;}
  header .brand{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
  header .brand span{color:var(--muted);}
  header .date{font-size:12px;color:var(--muted);text-align:right;}

  /* Tabs */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;background:var(--panel);
    border-top:1px solid var(--stroke);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:20;
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--muted);
    font-family:'Manrope',sans-serif;font-weight:700;font-size:9.5px;
    letter-spacing:0;text-transform:uppercase;line-height:1.25;
    padding:7px 1px;border-radius:10px;cursor:pointer;
  }
  nav.tabs button.active{color:var(--bg);background:var(--accent);}

  .card{
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }

  /* Alerts */
  .alert{
    display:flex;gap:10px;align-items:flex-start;
    border-radius:12px;padding:12px 14px;margin-bottom:10px;
    font-size:13px;line-height:1.4;border:1px solid transparent;
  }
  .alert.warn{background:rgba(227,169,77,.12);border-color:rgba(227,169,77,.35);color:#F0CE93;}
  .alert.danger{background:rgba(221,91,79,.12);border-color:rgba(221,91,79,.35);color:#F3A79E;}
  .alert .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;}
  .alert.warn .dot{background:var(--warn);}
  .alert.danger .dot{background:var(--danger);}
  .alert-empty{color:var(--muted);font-size:13px;padding:6px 2px;}

  /* Gauge cluster (3 dials) */
  .dials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .dial{text-align:center;}
  .dial svg{width:100%;height:auto;display:block;}
  .dial .label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
  .dial .amt{font-size:13px;margin-top:2px;}
  .dial .amt .of{color:var(--muted);font-size:11px;}

  /* Fuel-style horizontal bars for fixed categories */
  .fuelrow{margin-bottom:14px;}
  .fuelrow:last-child{margin-bottom:0;}
  .fuelrow .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .fuelrow .name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .fuelrow .figs{font-size:12px;color:var(--muted);}
  .fuelrow .figs b{color:var(--text);font-weight:600;}
  .track{height:10px;border-radius:6px;background:var(--panel-alt);overflow:hidden;position:relative;border:1px solid var(--stroke);}
  .fill{height:100%;border-radius:6px;transition:width .4s ease;}
  .fill.ok{background:linear-gradient(90deg,#3E9268,var(--ok));}
  .fill.warn{background:linear-gradient(90deg,#C68C36,var(--warn));}
  .fill.danger{background:linear-gradient(90deg,#B84438,var(--danger));}
  .pace-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55;}

  /* Forms */
  label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px;letter-spacing:.03em;}
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%;background:var(--panel-alt);border:1px solid var(--stroke);
    color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;
    font-family:'Manrope',sans-serif;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .seg{display:flex;gap:6px;}
  .seg button{
    flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--stroke);
    background:var(--panel-alt);color:var(--muted);font-weight:700;font-size:12px;
    letter-spacing:.03em;cursor:pointer;
  }
  .seg button.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
  .btn-primary{
    width:100%;margin-top:16px;padding:13px;border-radius:12px;border:none;
    background:var(--accent);color:var(--bg);font-weight:800;font-size:14px;
    letter-spacing:.02em;cursor:pointer;
  }
  .btn-primary:active{transform:scale(.99);}
  .btn-primary:disabled{opacity:.6;}
  .btn-ghost{
    width:100%;margin-top:8px;padding:11px;border-radius:12px;
    border:1px solid var(--stroke);background:transparent;color:var(--muted);
    font-weight:700;font-size:12px;cursor:pointer;
  }
  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:var(--ok);color:#0E1A14;font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:30px;z-index:50;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}

  /* History */
  .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--stroke);
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-item .meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .hist-item .amt{font-family:'Space Mono',monospace;font-weight:700;}
  .amt.gasto{color:var(--danger);}
  .amt.ingreso{color:var(--ok);}
  .amt.ahorro{color:var(--accent);}
  .hist-item button{
    background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;
  }
  .empty-state{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}

  .fixed-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .fixed-row input:nth-of-type(1){flex:1.4;}
  .fixed-row input:nth-of-type(2){flex:1;}
  .fixed-row button{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;flex:none;}
  .split{display:flex;gap:8px;}
  .split > div{flex:1;}

  .setup-note{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
  .divider{height:1px;background:var(--stroke);margin:16px 0;}
  .small-label{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}

  /* Proyecciones */
  .proj-item{padding:12px 0;border-bottom:1px solid var(--stroke);}
  .proj-item:last-child{border-bottom:none;}
  .proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .proj-desc{font-size:14px;font-weight:700;}
  .proj-badge{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;border:1px solid;letter-spacing:.02em;}
  .proj-explain{font-size:13px;margin-top:8px;line-height:1.4;}
  .proj-detail{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .proj-actions{display:flex;gap:8px;margin-top:10px;}
  .proj-actions button{flex:1;font-size:11px;padding:9px 6px;margin-top:0;}

  /* Tarjetas de crédito */
  .card-tile{border:1px solid var(--stroke);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--panel-alt);}
  .card-tile:last-child{margin-bottom:0;}
  .card-tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-tile-name{font-size:15px;font-weight:800;}
  .card-tile-last4{font-family:'Space Mono',monospace;font-weight:400;color:var(--muted);font-size:12px;}
  .card-tile-bank{font-size:11px;color:var(--muted);margin-top:2px;}
  .card-tile-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:10px;}
  .card-tile-pay{display:flex;gap:8px;margin-top:10px;}
  .card-tile-pay input{flex:1;}
  .card-tile-pay button{flex:none;margin-top:0;width:auto;white-space:nowrap;}

  /* Bot chat */
  .chat-thread{margin-bottom:6px;}
  .chat-msg{padding:8px 0;border-bottom:1px solid var(--stroke);}
  .chat-msg:last-child{border-bottom:none;}
  .chat-role{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px;}
  .chat-msg.user .chat-role{color:var(--accent);}
  .chat-text{font-size:13px;line-height:1.5;white-space:pre-wrap;}
  .chat-text.error{color:var(--danger);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<nav class="tabs" id="tabs" style="display:none;">
  <button data-tab="hoy" class="active">Hoy</button>
  <button data-tab="registrar">Registrar</button>
  <button data-tab="proyectar">Proyectar</button>
  <button data-tab="tarjetas">Tarjetas</button>
  <button data-tab="historial">Historial</button>
  <button data-tab="ajustes">Ajustes</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const supa = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

const DEFAULT_CONFIG = {
  ingresoFijo: 6000,
  apoyoVariable: 2500,
  allocPct: { ahorro: 12, estiloVida: 73, diversion: 15, emergenciaPctOfAhorro: 50 },
  metaFondoEmergenciaMeses: 3,
  fixedExpenses: [
    { id: 'gasolina',  name: 'Gasolina',       icon:'⛽', monthly: 1600 },
    { id: 'gym',       name: 'Gym',            icon:'🏋️', monthly: 1100 },
    { id: 'psic1',     name: 'Psicóloga 1',    icon:'🧠', monthly: 300 },
    { id: 'psic2',     name: 'Psicóloga 2',    icon:'🧠', monthly: 300 },
    { id: 'seguro',    name: 'Seguro',         icon:'🛡️', monthly: 423 },
    { id: 'caja',      name: 'Caja Popular',   icon:'🏦', monthly: 500 },
    { id: 'icloud',    name: 'iCloud',         icon:'☁️', monthly: 179 },
  ],
  // Placeholder con los últimos datos conocidos (cortes de julio 2026) — actualiza el saldo
  // real en la pestaña Tarjetas, ya que va bajando cada mes con los abonos.
  debt: {
    cards: [
      { id:'joy',      name:'JOY',      bank:'', last4:'0883', saldo:7809.71,  limite:0, tasaMensual:5.6, abonoMensual:2000, pagoMinimo:0, corteDia:null, pagoDia:null },
      { id:'clasica',  name:'CLÁSICA',  bank:'', last4:'4612', saldo:10034.22, limite:0, tasaMensual:1.4, abonoMensual:0,    pagoMinimo:0, corteDia:null, pagoDia:null },
    ]
  },
  investments: [],
};

let state = {
  session: null,
  authView: 'signin',
  authEmail: '',
  authError: '',
  authBusy: false,
  localImport: null,
  config: null,
  entries: [],
  proyecciones: [],
  cardPayments: [],
  showCardForm: false,
  cardDraft: null,
  expandedCard: null,
  cardWhatIf: {},
  showInvestmentForm: false,
  investmentDraft: null,
  monthlySummaries: [],
  importPreview: null,
  expandedSummary: null,
  tab: 'hoy',
  showExport: false,
  showBackup: false,
  entryDraft: { type:'gasto', category:null, metodoPago:'', subtype:'proposito', metaNombre:'', fuente:'nomina', amount:'', note:'', date: todayISO() },
  projDraft: { desc:'', amount:'', category:'otro', targetMonth: nextMonthKey() },
  chat: { messages: [], loading: false },
  accessCode: ''
};

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nextMonthKey(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function fmt(n){
  return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeCard(c){
  return {
    id: c.id || 'debt'+uid(),
    name: c.name || 'Tarjeta',
    bank: c.bank || '',
    last4: c.last4 || '',
    saldo: Number(c.saldo)||0,
    limite: Number(c.limite)||0,
    tasaMensual: Number(c.tasaMensual)||0,
    abonoMensual: Number(c.abonoMensual)||0,
    pagoMinimo: Number(c.pagoMinimo)||0,
    corteDia: c.corteDia ? Number(c.corteDia) : null,
    pagoDia: c.pagoDia ? Number(c.pagoDia) : null,
  };
}
function normalizeInvestment(i){
  return {
    id: i.id || 'inv'+uid(),
    name: i.name || 'Inversión',
    type: i.type || '',
    montoInicial: Number(i.montoInicial)||0,
    aportacionMensual: Number(i.aportacionMensual)||0,
    tasaAnualEstimada: Number(i.tasaAnualEstimada)||0,
    fechaInicio: i.fechaInicio || todayISO(),
  };
}
// Interés compuesto simple: monto inicial creciendo mes a mes a la tasa mensual
// equivalente, más una aportación mensual constante que también empieza a generar
// rendimiento desde el mes en que se aporta. No pretende ser exacto a nivel
// contable (no considera comisiones, impuestos, ni tasas variables) — es una
// estimación para orientar, igual que evaluateProjection() y simulatePayoff().
function investmentMonthsElapsed(inv, asOf){
  const start = new Date((inv.fechaInicio||todayISO())+'T12:00:00');
  const ref = asOf || new Date();
  return Math.max(0, (ref.getFullYear()-start.getFullYear())*12 + (ref.getMonth()-start.getMonth()));
}
function estimateInvestmentValue(inv, monthsAhead){
  const months = investmentMonthsElapsed(inv) + (monthsAhead||0);
  const tasaMensual = (inv.tasaAnualEstimada||0)/100/12;
  let valor = inv.montoInicial||0;
  for(let i=0;i<months;i++){
    valor = valor*(1+tasaMensual) + (inv.aportacionMensual||0);
  }
  return valor;
}
// Rellena valores por defecto en un config que puede venir de una versión vieja
// (localStorage viejo, un respaldo JSON viejo, o una fila de Supabase sin las
// columnas nuevas) — un solo lugar para no repetir estos checks en cada punto
// de carga/restauración.
function normalizeConfig(cfg){
  if(!cfg) cfg = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if(!cfg.debt) cfg.debt = { cards: [] };
  cfg.debt.cards = cfg.debt.cards.map(normalizeCard);
  if(!Array.isArray(cfg.investments)) cfg.investments = [];
  cfg.investments = cfg.investments.map(normalizeInvestment);
  if(typeof cfg.apoyoVariable !== 'number') cfg.apoyoVariable = 0;
  if(!cfg.allocPct) cfg.allocPct = { ahorro:12, estiloVida:73, diversion:15 };
  if(typeof cfg.allocPct.emergenciaPctOfAhorro !== 'number') cfg.allocPct.emergenciaPctOfAhorro = 50;
  if(typeof cfg.metaFondoEmergenciaMeses !== 'number') cfg.metaFondoEmergenciaMeses = 3;
  return cfg;
}

/* ---------- arranque + sesión (Supabase Auth es opcional) ---------- */
// Si no hay config.js (o no tiene URL/anon key), la app funciona en modo local:
// todo se guarda en localStorage, sin pedir cuenta, igual que la primera versión.
// Si sí hay Supabase configurado, se activa login + sincronización en la nube.
function isCloud(){ return !!(supa && state.session); }

async function boot(){
  try{
    state.accessCode = localStorage.getItem('panel_access_code') || '';
  }catch(e){ state.accessCode = ''; }

  if(!supa){
    loadLocalData();
    state.tab = 'hoy';
    render();
    return;
  }

  const { data } = await supa.auth.getSession();
  state.session = data.session;

  supa.auth.onAuthStateChange((_event, session)=>{
    const hadSession = !!state.session;
    state.session = session;
    if(session && !hadSession) initUserData();
    if(!session){
      state.config=null; state.entries=[]; state.proyecciones=[]; state.cardPayments=[];
      state.showCardForm=false; state.cardDraft=null; state.expandedCard=null; state.tab='hoy';
      state.monthlySummaries=[]; state.showInvestmentForm=false; state.investmentDraft=null; state.expandedSummary=null;
      render();
    }
  });

  if(state.session){ await initUserData(); }
  else { render(); }
}

/* ---------- modo local (sin Supabase configurado) ---------- */
function loadLocalData(){
  try{
    const c = localStorage.getItem('panel_config');
    state.config = c ? JSON.parse(c) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }catch(e){ state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
  normalizeConfig(state.config);
  try{
    const e = localStorage.getItem('panel_entries');
    state.entries = e ? JSON.parse(e) : [];
  }catch(e){ state.entries = []; }
  try{
    const p = localStorage.getItem('panel_proyecciones');
    state.proyecciones = p ? JSON.parse(p) : [];
  }catch(e){ state.proyecciones = []; }
  try{
    const cp = localStorage.getItem('panel_card_payments');
    state.cardPayments = cp ? JSON.parse(cp) : [];
  }catch(e){ state.cardPayments = []; }
  try{
    const ms = localStorage.getItem('panel_monthly_summaries');
    state.monthlySummaries = ms ? JSON.parse(ms) : [];
  }catch(e){ state.monthlySummaries = []; }
}
async function persistEntriesLocal(){
  try{ localStorage.setItem('panel_entries', JSON.stringify(state.entries)); }catch(e){ showToast('No se pudo guardar'); }
}
async function persistProjectionsLocal(){
  try{ localStorage.setItem('panel_proyecciones', JSON.stringify(state.proyecciones)); }catch(e){ showToast('No se pudo guardar'); }
}
async function persistCardPaymentsLocal(){
  try{ localStorage.setItem('panel_card_payments', JSON.stringify(state.cardPayments)); }catch(e){ showToast('No se pudo guardar'); }
}
async function persistMonthlySummariesLocal(){
  try{ localStorage.setItem('panel_monthly_summaries', JSON.stringify(state.monthlySummaries)); }catch(e){ showToast('No se pudo guardar'); }
}

/* ---------- persistencia (nube si hay sesión, si no local) ---------- */
async function addEntryPersist(entry){
  if(isCloud()){
    const { error } = await supa.from('entries').insert({
      id: entry.id, user_id: state.session.user.id, type: entry.type, category: entry.category,
      amount: entry.amount, note: entry.note, date: entry.date,
      subtype: entry.subtype || null, meta_nombre: entry.metaNombre || null, fuente: entry.fuente || null,
      metodo_pago: entry.metodoPago || null,
    });
    if(error) return false;
    state.entries.push(entry);
  } else {
    state.entries.push(entry);
    await persistEntriesLocal();
  }
  return true;
}
async function deleteEntryPersist(id){
  if(isCloud()){
    const { error } = await supa.from('entries').delete().eq('id', id);
    if(error) return false;
    state.entries = state.entries.filter(e=>e.id!==id);
  } else {
    state.entries = state.entries.filter(e=>e.id!==id);
    await persistEntriesLocal();
  }
  return true;
}
async function addProjectionPersist(proj){
  if(isCloud()){
    const { error } = await supa.from('projections').insert({
      id: proj.id, user_id: state.session.user.id, description: proj.desc,
      amount: proj.amount, category: proj.category, target_month: proj.targetMonth,
    });
    if(error) return false;
    state.proyecciones.push(proj);

async function saveConfig(){
  if(!isCloud()){
    try{ localStorage.setItem('panel_config', JSON.stringify(state.config)); }
    catch(e){ showToast('No se pudo guardar'); }
    return;
  }
  const userId = state.session.user.id;
  const cfg = state.config;
  try{
    let error;
    ({ error } = await supa.from('profiles').upsert({
      id: userId,
      ingreso_fijo: cfg.ingresoFijo,
      apoyo_variable: cfg.apoyoVariable,
      alloc_ahorro: cfg.allocPct.ahorro,
      alloc_estilo: cfg.allocPct.estiloVida,
      alloc_diversion: cfg.allocPct.diversion,
      emergencia_pct_of_ahorro: cfg.allocPct.emergenciaPctOfAhorro,
      meta_emergencia_meses: cfg.metaFondoEmergenciaMeses,
      updated_at: new Date().toISOString(),
    }));
    if(error) throw error;

    ({ error } = await supa.from('fixed_expenses').delete().eq('user_id', userId));
    if(error) throw error;
    if(cfg.fixedExpenses.length){
      ({ error } = await supa.from('fixed_expenses').insert(
        cfg.fixedExpenses.map((c,i)=>({ id:c.id, user_id:userId, name:c.name, icon:c.icon||'💳', monthly:c.monthly, sort_order:i }))
      ));
      if(error) throw error;
    }

    ({ error } = await supa.from('debts').delete().eq('user_id', userId));
    if(error) throw error;
    if(cfg.debt.cards.length){
      ({ error } = await supa.from('debts').insert(
        cfg.debt.cards.map(c=>({
          id:c.id, user_id:userId, name:c.name, saldo:c.saldo,
          tasa_mensual:c.tasaMensual, abono_mensual:c.abonoMensual,
          bank:c.bank||null, last4:c.last4||null, limite:c.limite||0,
          corte_dia:c.corteDia||null, pago_dia:c.pagoDia||null, pago_minimo:c.pagoMinimo||0,
        }))
      ));
      if(error) throw error;
    }

    ({ error } = await supa.from('investments').delete().eq('user_id', userId));
    if(error) throw error;
    if(cfg.investments.length){
      ({ error } = await supa.from('investments').insert(
        cfg.investments.map(i=>({
          id:i.id, user_id:userId, name:i.name, type:i.type||null,
          monto_inicial:i.montoInicial, aportacion_mensual:i.aportacionMensual,
          tasa_anual_estimada:i.tasaAnualEstimada, fecha_inicio:i.fechaInicio,
        }))
      ));
      if(error) throw error;
    }
  }catch(e){ showToast('No se pudo guardar en la nube'); }
}

/* ---------- importar datos viejos de localStorage a la cuenta ---------- */
function maybeOfferLocalImport(){
  let legacyConfig=null, legacyEntries=[], legacyProy=[];
  try{ legacyConfig = JSON.parse(localStorage.getItem('panel_config')); }catch(e){}
  try{ legacyEntries = JSON.parse(localStorage.getItem('panel_entries')) || []; }catch(e){}
  try{ legacyProy = JSON.parse(localStorage.getItem('panel_proyecciones')) || []; }catch(e){}
  const hasLegacy = legacyConfig || legacyEntries.length || legacyProy.length;
  const isFreshAccount = state.entries.length===0 && state.proyecciones.length===0;
  state.localImport = (hasLegacy && isFreshAccount) ? { config: legacyConfig, entries: legacyEntries, proyecciones: legacyProy } : null;
}
async function importLocalData(){
  const userId = state.session.user.id;
  const { config, entries, proyecciones } = state.localImport;
  if(config){
    state.config = normalizeConfig(config);
  }
  await saveConfig();
  if(entries.length){
    const { error } = await supa.from('entries').upsert(entries.map(e=>({ id:e.id, user_id:userId, type:e.type, category:e.category, amount:e.amount, note:e.note, date:e.date, subtype:e.subtype||null, meta_nombre:e.metaNombre||null, fuente:e.fuente||null, metodo_pago:e.metodoPago||null })));

/* ---------- date helpers ---------- */
function startOfWeek(d){
  const dt = new Date(d); const day = (dt.getDay()+6)%7; // Monday=0
  dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day);
  return dt;
}
function endOfWeek(d){ const s = startOfWeek(d); const e = new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999); return e; }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function inRange(dateStr, start, end){
  const t = new Date(dateStr+'T12:00:00').getTime();
  return t >= start.getTime() && t <= end.getTime();
}
function entriesForMonth(y, m, catId, type){
  return state.entries.filter(e=>{
    const d = new Date(e.date+'T12:00:00');
    return d.getFullYear()===y && d.getMonth()===m && (!type || e.type===type) && (!catId || e.category===catId);
  });
}
function monthEntries(catId, type){
  const now = new Date();
  return entriesForMonth(now.getFullYear(), now.getMonth(), catId, type);
}
function weekEntries(catId, type){
  const now = new Date(); const s = startOfWeek(now), e = endOfWeek(now);
  return state.entries.filter(x=> (!type || x.type===type) && (!catId || x.category===catId) && inRange(x.date, s, e));
}
function sum(arr){ return arr.reduce((a,b)=>a+Number(b.amount||0),0); }

/* ---------- alerts ---------- */
function computeAlerts(){
  const alerts = [];
  const cfg = state.config;
  const now = new Date();
  const dim = daysInMonth(now);
  const dayFrac = now.getDate()/dim;

  // Fixed categories: pace-based monthly alert
  cfg.fixedExpenses.forEach(cat=>{
    const spent = sum(monthEntries(cat.id,'gasto'));
    const expectedPace = cat.monthly * dayFrac;
    if(cat.monthly>0 && spent > cat.monthly){
      alerts.push({level:'danger', text:`Ya superaste tu presupuesto de ${cat.name} este mes: llevas ${fmt(spent)} de ${fmt(cat.monthly)}.`});
    } else if(cat.monthly>0 && spent > expectedPace*1.25 && spent>0){
      alerts.push({level:'warn', text:`Vas más rápido de lo normal en ${cat.name}: ${fmt(spent)} llevados, a este ritmo te vas a pasar antes de fin de mes.`});
    }
  });

  // Diversión/Libre — weekly
  const divMonthly = cfg.ingresoFijo * (cfg.allocPct.diversion/100);
  const divWeekly = divMonthly / 4.33;
  const divSpentWeek = sum(weekEntries('diversion','gasto'));
  if(divSpentWeek >= divWeekly){
    alerts.push({level:'danger', text:`Te pasaste de tu tope semanal de Diversión/Libre: ${fmt(divSpentWeek)} de ${fmt(divWeekly)}.`});
  } else if(divSpentWeek >= divWeekly*0.8){
    alerts.push({level:'warn', text:`Ya vas en ${Math.round(divSpentWeek/divWeekly*100)}% de tu tope semanal de Diversión/Libre. Cuídalo.`});
  }

  // Ahorro — monthly goal pace (informational, gentle)
  const ahorroMonthly = cfg.ingresoFijo * (cfg.allocPct.ahorro/100);
  const ahorroSaved = sum(monthEntries(null,'ahorro'));
  if(dayFrac > 0.5 && ahorroSaved < ahorroMonthly*0.4){
    alerts.push({level:'warn', text:`Ya pasó más de la mitad del mes y solo llevas ${fmt(ahorroSaved)} de tu meta de ahorro (${fmt(ahorroMonthly)}).`});
  }

  // Deuda con interés activa (informational)
  const cards = (cfg.debt && cfg.debt.cards) || [];
  const conInteres = cards.filter(c=>c.saldo>0 && c.tasaMensual>0);
  if(conInteres.length){
    const total = sum(conInteres.map(c=>({amount:c.saldo})));
    alerts.push({level:'warn', text:`Tienes ${fmt(total)} de deuda generando interés (${conInteres.map(c=>c.name).join(', ')}). Cada gasto extra compite con pagarla más rápido.`});
  }

  // Tarjetas: utilización, fecha de pago próxima, abono que no alcanza a cubrir el interés
  cards.forEach(c=>{
    if(c.limite>0){
      const util = c.saldo/c.limite;
      if(util>=0.9){
        alerts.push({level:'danger', text:`${c.name} está casi al límite: ${Math.round(util*100)}% usado (${fmt(c.saldo)} de ${fmt(c.limite)}).`});
      } else if(util>=0.7){
        alerts.push({level:'warn', text:`${c.name} va en ${Math.round(util*100)}% de uso de su límite — cuida no acercarte más.`});
      }
    }
    const proximoPago = nextOccurrenceOfDay(c.pagoDia);
    const dias = daysUntil(proximoPago);
    if(dias!==null && dias<=5 && c.saldo>0){
      alerts.push({level: dias<=1?'danger':'warn', text:`El pago de ${c.name} vence ${dias<=0?'hoy':'en '+dias+' día'+(dias===1?'':'s')} — no lo dejes pasar.`});
    }
    if(c.saldo>0 && c.tasaMensual>0 && c.abonoMensual>0 && c.abonoMensual <= c.saldo*(c.tasaMensual/100)){
      alerts.push({level:'danger', text:`Tu abono a ${c.name} (${fmt(c.abonoMensual)}) no alcanza a cubrir el interés del mes — con ese abono nunca vas a bajar el saldo.`});
    }
  });

  // Recordatorio: ya pasó el mes y no se ha cerrado en Historial
  const prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonthKey = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth()+1).padStart(2,'0')}`;
  const yaCerrado = state.monthlySummaries.some(s=>s.month===prevMonthKey);
  const huboMovimientosMesAnterior = entriesForMonth(prevMonthDate.getFullYear(), prevMonthDate.getMonth()).length>0;
  if(now.getDate()>=2 && !yaCerrado && huboMovimientosMesAnterior){
    alerts.push({level:'warn', text:`Ya pasó ${MESES[prevMonthDate.getMonth()]} y no lo has cerrado — ve a Historial → Cierres mensuales para guardar el resumen y el diagnóstico de ese mes.`});
  }

  return alerts;
}

/* ---------- Proyecciones: evaluación ---------- */
function evaluateProjection(cfg, proj){
  const now = new Date();
  const parts = (proj.targetMonth||nextMonthKey()).split('-').map(Number);
  const targetDate = new Date(parts[0], (parts[1]||1)-1, 1);
  const monthsAhead = Math.max(0, (targetDate.getFullYear()-now.getFullYear())*12 + (targetDate.getMonth()-now.getMonth()));

  const divMeta = cfg.ingresoFijo*(cfg.allocPct.diversion/100);
  const ahorroMeta = cfg.ingresoFijo*(cfg.allocPct.ahorro/100);
  const divSpent = sum(monthEntries('diversion','gasto'));
  const ahorroSaved = sum(monthEntries(null,'ahorro'));

  const dim = daysInMonth(now);
  const dayFrac = now.getDate()/dim;
  const remainingThisMonthDiv = Math.max(0, divMeta - divSpent);
  const ahorroGap = Math.max(0, ahorroMeta*dayFrac - ahorroSaved);

  // Colchón acumulado disponible entre hoy y el mes objetivo: lo que queda del presupuesto
  // de Diversión/Libre de este mes, más un aporte conservador por cada mes futuro completo
  // (presupuesto de diversión de ese mes + la mitad del apoyo variable, que no está prometido).
  let acumulado = remainingThisMonthDiv;
  for(let i=1;i<=monthsAhead;i++){
    acumulado += divMeta + (cfg.apoyoVariable||0)*0.5;
  }
  acumulado -= ahorroGap;

  const cards = (cfg.debt && cfg.debt.cards) || [];
  const deudaConInteres = cards.filter(c=>c.saldo>0 && c.tasaMensual>0);

  let level, headline;
  if(deudaConInteres.length && proj.amount > acumulado*0.5){
    level = 'danger';
    headline = 'Mejor espera: tienes deuda generando interés y este gasto se comería buena parte de tu colchón disponible.';
  } else if(proj.amount <= acumulado){
    level = 'ok';
    headline = monthsAhead===0
      ? 'Sí te alcanza dentro de tu presupuesto de Diversión/Libre de este mes.'
      : `Para ${MESES[targetDate.getMonth()]} deberías tenerlo cubierto si mantienes tu ritmo actual.`;
  } else if(proj.amount <= acumulado*1.3){
    level = 'warn';
    headline = 'Está justo: te alcanza pero con poco margen. Considera esperar un poco más o recortar Diversión mientras tanto.';
  } else {
    level = 'danger';
    headline = 'Todavía no. A tu ritmo actual te faltaría dinero para esto sin tocar tu ahorro o tu deuda.';
  }

  return { level, headline, acumulado, ahorroGap, deudaConInteres, monthsAhead, remainingThisMonthDiv };
}

function evalBadge(level){
  if(level==='ok') return ['✓ Sí, adelante', 'var(--ok)', 'rgba(79,168,124,.14)'];
  if(level==='warn') return ['⚠ Con cuidado', 'var(--warn)', 'rgba(227,169,77,.14)'];
  return ['✗ Mejor espera', 'var(--danger)', 'rgba(221,91,79,.14)'];
}

/* ---------- contexto financiero para el bot ---------- */
function buildFinancialContext(){
  const cfg = state.config;
  const ahorroM = cfg.ingresoFijo*(cfg.allocPct.ahorro/100);
  const estiloM = cfg.ingresoFijo*(cfg.allocPct.estiloVida/100);
  const divM = cfg.ingresoFijo*(cfg.allocPct.diversion/100);
  const ahorroSaved = sum(monthEntries(null,'ahorro'));
  const estiloSpent = sum(cfg.fixedExpenses.map(c=>({amount: sum(monthEntries(c.id,'gasto'))})));
  const divSpent = sum(monthEntries('diversion','gasto'));
  const debt = cfg.debt || { cards: [] };
  const nw = computeNetWorth();
  const ah = computeAhorroSplit(cfg);
  const now = new Date();
  const ingresoMesActual = computeIngresosMonth(now.getFullYear(), now.getMonth()).total;
  const ultimos3 = [1,2,3].map(i=>{ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); return computeIngresosMonth(d.getFullYear(), d.getMonth()).total; });
  const promedioIngreso3Meses = ultimos3.reduce((a,b)=>a+b,0)/3;

  return {
    fecha: todayISO(),
    ingresoFijoMensual: cfg.ingresoFijo,
    apoyoVariableMensual: cfg.apoyoVariable,
    ingresoRealEsteMes: ingresoMesActual,
    promedioIngresoUltimos3Meses: Math.round(promedioIngreso3Meses),
    distribucionPct: cfg.allocPct,
    metasDelMes: { ahorro: ahorroM, estiloVida: estiloM, diversion: divM },
    gastadoEsteMes: { ahorro: ahorroSaved, estiloVida: estiloSpent, diversion: divSpent },
    ahorroFondoEmergencia: {
      acumuladoTotal: ah.emergenciaAcumuladoTotal,
      mesesDeGastosFijosQueCubre: Math.round(ah.mesesCubiertos*10)/10,
      metaMeses: ah.metaMeses,
    },
    patrimonioNeto: {
      total: nw.patrimonioNeto,
      ahorroAcumulado: nw.ahorroAcumuladoTotal,
      valorInversiones: nw.valorInversiones,
      deudaTotal: nw.deudaTotal,
    },
    inversiones: (cfg.investments||[]).map(inv=>({
      nombre: inv.name, tipo: inv.type||null, valorEstimadoActual: Math.round(estimateInvestmentValue(inv)),
      tasaAnualEstimadaPct: inv.tasaAnualEstimada, aportacionMensual: inv.aportacionMensual,
    })),
    gastosFijos: cfg.fixedExpenses.map(c=>({ nombre:c.name, presupuestoMensual:c.monthly, gastadoEsteMes: sum(monthEntries(c.id,'gasto')) })),
    deudas: debt.cards.map(c=>{
      const sim = simulatePayoff(c);
      return {
        nombre: c.name,
        banco: c.bank || null,
        saldo: c.saldo,
        limiteCredito: c.limite || null,
        utilizacionPct: c.limite>0 ? Math.round((c.saldo/c.limite)*100) : null,
        tasaMensualPct: c.tasaMensual,
        abonoMensualComprometido: c.abonoMensual,
        diaCorte: c.corteDia || null,
        diaPago: c.pagoDia || null,
        pagoMinimo: c.pagoMinimo || null,
        gastadoEnCicloActual: Math.round(cardCycleSpend(c)),
        mesesParaLiquidarConAbonoActual: sim.neverPaysOff ? null : sim.months,
        interesTotalProyectado: sim.neverPaysOff ? null : Math.round(sim.totalInterest),
        nuncaSeLiquidaConAbonoActual: !!sim.neverPaysOff,
      };
    }),
    proyeccionesPendientes: state.proyecciones.map(p=>({ descripcion:p.desc||catName(p.category), monto:p.amount, mesObjetivo:p.targetMonth })),
  };
}

  return `

        <div class="brand">PANEL <span>/ control diario</span></div>

        <label>Correo</label>
        <input type="email" id="auth-email" value="${escapeHtml(state.authEmail||'')}" placeholder="tu@correo.com" autocomplete="email">
        <label>Contraseña</label>
        <input type="password" id="auth-password" placeholder="mínimo 6 caracteres" autocomplete="${isSignup?'new-password':'current-password'}">
        <button class="btn-primary" id="auth-submit" ${state.authBusy?'disabled':''}>${state.authBusy ? 'Un momento…' : (isSignup ? 'Crear cuenta' : 'Entrar')}</button>
        <button class="btn-ghost" id="auth-switch">${isSignup ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Créala'}</button>
      </div>
    </div>`;
}

function attachAuthHandlers(){
  const submit = async ()=>{
    if(state.authBusy) return;
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    state.authEmail = email;
    if(!email || !password || password.length<6){
      state.authError = 'Pon un correo válido y una contraseña de al menos 6 caracteres.';
      render();
      return;
    }
    state.authError = '';
    state.authBusy = true;
    render();
    const { data, error } = state.authView==='signup'
      ? await supa.auth.signUp({ email, password })
      : await supa.auth.signInWithPassword({ email, password });
    state.authBusy = false;
    if(error){
      state.authError = error.message;
      render();
      return;
    }
    if(!data.session){
      state.authError = 'Cuenta creada. Revisa tu correo para confirmar tu cuenta y luego inicia sesión.';
      state.authView = 'signin';
      render();
      return;
    }
    state.session = data.session;
    await initUserData();
  };
  document.getElementById('auth-submit').onclick = submit;
  document.getElementById('auth-password').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  document.getElementById('auth-switch').onclick = ()=>{
    state.authView = isSignupView() ? 'signin' : 'signup';
    state.authError = '';
    render();
  };
}
function isSignupView(){ return state.authView==='signup'; }

function arcGauge(pct, colorVar){
  pct = Math.max(0, Math.min(pct, 1.15));
  const r = 40, c = 2*Math.PI*r*0.75; // 270deg arc
  const dash = Math.min(pct,1) * c;
  return `
  <svg viewBox="0 0 100 76" >
    <path d="M 20 66 A 40 40 0 1 1 80 66" fill="none" stroke="var(--stroke)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 20 66 A 40 40 0 1 1 80 66" fill="none" stroke="${colorVar}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${dash} ${c}"/>
  </svg>`;
}

function pctColorVar(pct){
  if(pct >= 1) return 'var(--danger)';
  if(pct >= 0.8) return 'var(--warn)';
  return 'var(--ok)';
}
function pctClass(pct){
  if(pct>=1) return 'danger';
  if(pct>=0.8) return 'warn';
  return 'ok';
}

/* ---------- tarjetas: fechas, utilización, simulación de liquidación ---------- */
function utilClass(pct){
  if(pct>=0.7) return 'danger';
  if(pct>=0.3) return 'warn';
  return 'ok';
}
function nextOccurrenceOfDay(day){
  if(!day) return null;
  const now = new Date();
  let y=now.getFullYear(), m=now.getMonth();
  let d = Math.min(day, daysInMonth(new Date(y,m,1)));
  let candidate = new Date(y,m,d,23,59,59);
  if(candidate < now){
    m += 1;
    if(m>11){ m=0; y+=1; }
    d = Math.min(day, daysInMonth(new Date(y,m,1)));
    candidate = new Date(y,m,d,23,59,59);
  }
  return candidate;
}
function daysUntil(date){
  if(!date) return null;
  return Math.ceil((date - new Date()) / 86400000);
}
function addMonths(date, n){
  const d = new Date(date); d.setMonth(d.getMonth()+n); return d;
}
function simulatePayoff(card){
  const tasa = (card.tasaMensual||0)/100;
  let saldo = card.saldo||0;
  const abono = card.abonoMensual||0;
  if(saldo<=0) return { months:0, totalInterest:0, neverPaysOff:false };
  if(abono<=0) return { months:null, totalInterest:null, neverPaysOff:true };
  let months=0, totalInterest=0;
  while(saldo>0.5 && months<600){
    const interes = saldo*tasa;
    const nuevoSaldo = saldo + interes - abono;
    if(nuevoSaldo >= saldo - 0.005){ return { months:null, totalInterest:null, neverPaysOff:true }; }
    totalInterest += interes;
    saldo = Math.max(0, nuevoSaldo);
    months++;
  }
  if(saldo>0.5) return { months:null, totalInterest:null, neverPaysOff:true };
  return { months, totalInterest, neverPaysOff:false };
}

/* ---------- gasto por tarjeta, ciclo de corte a corte ---------- */
function cardCycleRange(card, refDate){
  const now = refDate || new Date();
  if(!card.corteDia){
    // Sin día de corte configurado: usamos el mes calendario como respaldo.
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 1);
    return { start, end, usesCalendarFallback: true };
  }
  const end = nextOccurrenceOfDay(card.corteDia);
  const start = new Date(end);
  start.setMonth(start.getMonth()-1);
  return { start, end, usesCalendarFallback: false };
}
function cardCycleGastos(card){
  const { start, end } = cardCycleRange(card);
  return state.entries.filter(e=>{
    if(e.type!=='gasto' || e.metodoPago!==card.id) return false;
    const d = new Date(e.date+'T12:00:00');
    return d>=start && d<end;
  }).sort((a,b)=> b.date.localeCompare(a.date));
}
function cardCycleSpend(card){
  return sum(cardCycleGastos(card));
}

function computeNetWorth(){
  const cfg = state.config;
  const ahorroAcumuladoTotal = sum(state.entries.filter(e=>e.type==='ahorro'));
  const deudaTotal = sum((cfg.debt.cards||[]).map(c=>({amount:c.saldo})));
  const valorInversiones = sum((cfg.investments||[]).map(inv=>({amount: estimateInvestmentValue(inv)})));
  const patrimonioNeto = ahorroAcumuladoTotal + valorInversiones - deudaTotal;
  return { ahorroAcumuladoTotal, deudaTotal, valorInversiones, patrimonioNeto };
}
function computeAhorroSplit(cfg){
  const ahorroM = cfg.ingresoFijo*(cfg.allocPct.ahorro/100);
  const emergenciaPct = cfg.allocPct.emergenciaPctOfAhorro!=null ? cfg.allocPct.emergenciaPctOfAhorro : 50;
  const emergenciaMetaMensual = ahorroM * (emergenciaPct/100);
  const propositoMetaMensual = ahorroM - emergenciaMetaMensual;
  const thisMonthAhorro = monthEntries(null,'ahorro');
  const emergenciaSavedMonth = sum(thisMonthAhorro.filter(e=>e.subtype==='emergencia'));
  const propositoSavedMonth = sum(thisMonthAhorro.filter(e=>e.subtype==='proposito'));
  const sinSubtypeMonth = sum(thisMonthAhorro.filter(e=>!e.subtype));
  const emergenciaAcumuladoTotal = sum(state.entries.filter(e=>e.type==='ahorro' && e.subtype==='emergencia'));
  const fixedTotal = sum(cfg.fixedExpenses.map(c=>({amount:c.monthly})));
  const mesesCubiertos = fixedTotal>0 ? emergenciaAcumuladoTotal/fixedTotal : 0;
  return {
    emergenciaMetaMensual, propositoMetaMensual, emergenciaSavedMonth, propositoSavedMonth,
    sinSubtypeMonth, emergenciaAcumuladoTotal, mesesCubiertos,
    metaMeses: cfg.metaFondoEmergenciaMeses||3,
  };
}

function computeIngresosMonth(y, m){
  const ingresos = entriesForMonth(y, m, null, 'ingreso');
  const total = sum(ingresos);
  const porFuente = {};
  FUENTES_INGRESO.forEach(f=> porFuente[f.id] = 0);
  ingresos.forEach(e=>{
    const f = e.fuente || 'otro';
    porFuente[f] = (porFuente[f]||0) + Number(e.amount||0);
  });
  return { total, porFuente };
}
function computeMonthClose(y, m){
  const cfg = state.config;
  const gastos = entriesForMonth(y, m, null, 'gasto');
  const ingresos = entriesForMonth(y, m, null, 'ingreso');
  const ahorros = entriesForMonth(y, m, null, 'ahorro');

  const ingresoReal = sum(ingresos);
  const ingresoConfigurado = cfg.ingresoFijo + cfg.apoyoVariable;

  const gastoPorCategoria = {};
  cfg.fixedExpenses.forEach(fx=>{ gastoPorCategoria[fx.id] = 0; });
  gastoPorCategoria.diversion = 0;
  gastoPorCategoria.otro = 0;
  gastos.forEach(e=>{
    const cat = e.category || 'otro';
    gastoPorCategoria[cat] = (gastoPorCategoria[cat]||0) + Number(e.amount||0);
  });
  const gastoTotal = sum(gastos);

  const ahorroReal = {
    emergencia: sum(ahorros.filter(e=>e.subtype==='emergencia')),
    proposito: sum(ahorros.filter(e=>e.subtype==='proposito')),
    sinSubtype: sum(ahorros.filter(e=>!e.subtype)),
  };
  const ahorroMeta = cfg.ingresoFijo*(cfg.allocPct.ahorro/100);

  const cards = cfg.debt.cards||[];
  const interesPagadoTotal = cards.reduce((a,c)=> a + (c.saldo>0 ? c.saldo*(c.tasaMensual/100) : 0), 0);
  const abonoInsuficiente = cards
    .filter(c=> c.saldo>0 && c.tasaMensual>0 && c.abonoMensual>0 && c.abonoMensual <= c.saldo*(c.tasaMensual/100))
    .map(c=>c.name);

  const deudaTotalFin = sum(cards.map(c=>({amount:c.saldo})));
  const pagosDelMes = state.cardPayments.filter(p=>{
    const d = new Date(p.date+'T12:00:00');
    return d.getFullYear()===y && d.getMonth()===m;
  });
  // deudaTotalInicio es la mejor estimación posible sin llevar snapshot diario de
  // saldo: el saldo de hoy más lo que ya se abonó este mes (así se acerca al saldo
  // que había al empezar el mes).
  const deudaTotalInicio = deudaTotalFin + sum(pagosDelMes);

  const valorInversionesFin = sum((cfg.investments||[]).map(inv=>({amount: estimateInvestmentValue(inv)})));
  const ahorroAcumuladoFin = sum(state.entries.filter(e=>e.type==='ahorro'));
  const patrimonioNeto = ahorroAcumuladoFin + valorInversionesFin - deudaTotalFin;

  return {
    id: 'ms'+uid(),
    month: `${y}-${String(m+1).padStart(2,'0')}`,
    ingresoReal, ingresoConfigurado,
    gastoTotal, gastoPorCategoria,
    ahorroReal, ahorroMeta,
    interesPagadoTotal: Math.round(interesPagadoTotal),
    abonoInsuficiente,
    deudaTotalInicio, deudaTotalFin,
    valorInversionesFin,
    patrimonioNeto,
    diagnostico: '',
  };
}
function generateDiagnostico(summary, prevSummary){
  const cfg = state.config;
  const lines = [];

  let peor = null, peorExceso = 0;
  cfg.fixedExpenses.forEach(fx=>{
    const gastado = summary.gastoPorCategoria[fx.id]||0;
    const exceso = gastado - fx.monthly;
    if(exceso > peorExceso){ peorExceso = exceso; peor = fx.name; }
  });
  if(peor){
    lines.push(`${peor} fue la categoría que más se salió de presupuesto, por ${fmt(peorExceso)}.`);
  }

  const cerrados = [...state.monthlySummaries]
    .filter(s=>s.month < summary.month)
    .sort((a,b)=>b.month.localeCompare(a.month))
    .slice(0,3);
  if(cerrados.length){
    const promedioDiv = cerrados.reduce((a,s)=> a + (s.gastoPorCategoria.diversion||0), 0) / cerrados.length;
    const divActual = summary.gastoPorCategoria.diversion||0;
    if(promedioDiv>0 && Math.abs(divActual-promedioDiv) > promedioDiv*0.15){
      const diff = divActual - promedioDiv;
      lines.push(diff>0
        ? `Gastaste ${fmt(diff)} más en Diversión que tu promedio de los últimos ${cerrados.length} meses cerrados.`
        : `Gastaste ${fmt(-diff)} menos en Diversión que tu promedio de los últimos ${cerrados.length} meses cerrados.`);
    }
  }

  if(summary.abonoInsuficiente.length){
    lines.push(`El abono a ${summary.abonoInsuficiente.join(', ')} no cubrió el interés generado este mes — el saldo no bajó por eso.`);
  }

  if(prevSummary){
    const diff = summary.patrimonioNeto - prevSummary.patrimonioNeto;
    if(Math.abs(diff) < 1){
      lines.push('Tu patrimonio neto se mantuvo prácticamente igual que el mes pasado.');
    } else {
      const ahorroDelta = summary.ahorroReal.emergencia + summary.ahorroReal.proposito + summary.ahorroReal.sinSubtype;
      const deudaDelta = prevSummary.deudaTotalFin - summary.deudaTotalFin;
      const invDelta = summary.valorInversionesFin - prevSummary.valorInversionesFin;
      const mayor = [
        { label:'el ahorro del mes', val: ahorroDelta },
        { label:'bajar tu deuda', val: deudaDelta },
        { label:'el rendimiento de tus inversiones', val: invDelta },
      ].sort((a,b)=>Math.abs(b.val)-Math.abs(a.val))[0];
      lines.push(diff>0
        ? `Tu patrimonio neto subió ${fmt(diff)} vs el mes pasado, sobre todo por ${mayor.label}.`
        : `Tu patrimonio neto bajó ${fmt(-diff)} vs el mes pasado — lo que más pesó fue ${mayor.label}.`);
    }
  }

  return lines.length ? lines.join(' ') : 'Mes sin nada fuera de lo normal — vas dentro de lo planeado.';
}

function last6MonthsIncome(){
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const info = computeIngresosMonth(d.getFullYear(), d.getMonth());
    months.push({ y:d.getFullYear(), m:d.getMonth(), label: MESES[d.getMonth()].slice(0,3), total: info.total });
  }
  return months;
}

function renderHoy(){
  const cfg = state.config;
  const now = new Date();
  const dim = daysInMonth(now);
  const dayFrac = now.getDate()/dim;

  const estiloM = cfg.ingresoFijo*(cfg.allocPct.estiloVida/100);
  const divM = cfg.ingresoFijo*(cfg.allocPct.diversion/100);
  const estiloSpent = sum(cfg.fixedExpenses.map(c=>({amount: sum(monthEntries(c.id,'gasto'))})));
  const divSpent = sum(monthEntries('diversion','gasto'));

  const alerts = computeAlerts();
  const alertsHtml = alerts.length
    ? alerts.map(a=>`<div class="alert ${a.level}"><div class="dot"></div><div>${a.text}</div></div>`).join('')
    : `<div class="alert-empty">Sin alertas por ahora — vas dentro de lo planeado. ✓</div>`;

  const nw = computeNetWorth();
  const netWorthCard = `
    <div class="card">
      <h2>Patrimonio neto</h2>

      <div class="card-tile-meta" style="margin-top:10px;">
        <span>Ahorro acumulado: <b class="num" style="color:var(--text);">${fmt(nw.ahorroAcumuladoTotal)}</b></span>
        <span>Inversión: <b class="num" style="color:var(--text);">${fmt(nw.valorInversiones)}</b></span>
        <span>Deuda: <b class="num" style="color:var(--danger);">-${fmt(nw.deudaTotal)}</b></span>

  const ah = computeAhorroSplit(cfg);
  const emergPct = ah.emergenciaMetaMensual? ah.emergenciaSavedMonth/ah.emergenciaMetaMensual : 0;
  const propoPct = ah.propositoMetaMensual? ah.propositoSavedMonth/ah.propositoMetaMensual : 0;
  const ahorroSplitCard = `
    <div class="card">

      <div class="fuelrow">
        <div class="top">
          <div class="name">🛟 Fondo de emergencia</div>
          <div class="figs"><b class="num">${fmt(ah.emergenciaSavedMonth)}</b> / ${fmt(Math.round(ah.emergenciaMetaMensual))} este mes</div>
        </div>
        <div class="track"><div class="fill ${pctClass(emergPct)}" style="width:${Math.min(emergPct*100,100)}%"></div></div>
        <div class="meta" style="font-size:11px;color:var(--muted);margin-top:4px;">Acumulado ${fmt(ah.emergenciaAcumuladoTotal)} — cubre ${ah.mesesCubiertos.toFixed(1)} de tus ${ah.metaMeses} meses meta de gastos fijos.</div>
      </div>
      <div class="fuelrow" style="margin-bottom:0;margin-top:14px;">
        <div class="top">
          <div class="name">🎯 Con propósito</div>
          <div class="figs"><b class="num">${fmt(ah.propositoSavedMonth)}</b> / ${fmt(Math.round(ah.propositoMetaMensual))} este mes</div>
        </div>
        <div class="track"><div class="fill ${pctClass(propoPct)}" style="width:${Math.min(propoPct*100,100)}%"></div></div>
      </div>
      ${ah.sinSubtypeMonth>0 ? `<div class="setup-note" style="margin:10px 0 0;">${fmt(ah.sinSubtypeMonth)} de ahorro este mes sin subtipo asignado (movimientos de antes de este cambio) — no cuenta en ninguna barra de arriba.</div>` : ''}
    </div>`;

  const dials = `
    <div class="dials" style="grid-template-columns:repeat(2,1fr);">
      <div class="dial">
        ${arcGauge(estiloM? estiloSpent/estiloM:0, pctColorVar(estiloM? estiloSpent/estiloM:0))}
        <div class="label">Estilo de vida</div>
        <div class="amt num">${fmt(estiloSpent)} <span class="of">/ ${fmt(estiloM)}</span></div>
      </div>
      <div class="dial">
        ${arcGauge(divM? divSpent/divM:0, pctColorVar(divM? divSpent/divM:0))}

  const divWeekly = divM/4.33;
  const divSpentWeek = sum(weekEntries('diversion','gasto'));
  const weekPct = divWeekly? divSpentWeek/divWeekly : 0;

  const fixedRows = cfg.fixedExpenses.map(c=>{
    const spent = sum(monthEntries(c.id,'gasto'));
    const pct = c.monthly? spent/c.monthly : 0;
    const pacePctPos = Math.min(dayFrac,1)*100;
    return `
      <div class="fuelrow">

  return `

      <h2>Diversión / Libre — esta semana</h2>
      <div class="fuelrow" style="margin-bottom:0">
        <div class="top">

    <div class="card">

      ${fixedRows}
      <div style="font-size:10px;color:var(--muted);margin-top:10px;">La línea vertical marca cuánto deberías llevar gastado según el día del mes.</div>
    </div>
  `;
}

function renderProyectar(){
  const cfg = state.config;
  const d = state.projDraft;
  const list = [...state.proyecciones].sort((a,b)=> a.targetMonth.localeCompare(b.targetMonth));

  const listHtml = list.length ? list.map(p=>{
    const ev = evaluateProjection(cfg, p);
    const [label, color, bg] = evalBadge(ev.level);
    const detailBits = [`Colchón estimado disponible: <b class="num">${fmt(Math.max(0,ev.acumulado))}</b>`];
    if(ev.deudaConInteres.length) detailBits.push('tienes deuda con interés activa');
    if(ev.ahorroGap>0) detailBits.push('vas atrasado en tu meta de ahorro del mes');
    return `
    <div class="proj-item">
      <div class="proj-top">
        <div>
          <div class="proj-desc">${escapeHtml(p.desc) || escapeHtml(catName(p.category))}</div>
          <div class="meta" style="font-size:11px;color:var(--muted);margin-top:2px;">${p.targetMonth} · ${escapeHtml(catName(p.category))}</div>
        </div>
        <div class="amt num">${fmt(p.amount)}</div>
      </div>
      <div class="proj-badge" style="color:${color};border-color:${color};background:${bg};">${label}</div>
      <div class="proj-explain">${ev.headline}</div>
      <div class="proj-detail">${detailBits.join(' · ')}</div>
      <div class="proj-actions">
        <button class="btn-ghost" data-proj-done="${p.id}">✓ Ya lo gasté</button>
        <button class="btn-ghost" data-proj-del="${p.id}" style="color:var(--danger);">Eliminar</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty-state">Todavía no tienes gastos futuros planeados.</div>`;

  return `

      <h2>Planear un gasto futuro</h2>

      <label>¿Para cuándo?</label>

function renderChatThread(){
  if(!state.chat.messages.length){
    return `<div class="empty-state" style="padding:10px 0;">Aún no le has preguntado nada.</div>`;
  }
  return state.chat.messages.map(m=> `
    <div class="chat-msg ${m.role}">
      <div class="chat-role">${m.role==='user' ? 'Tú' : 'Claude'}</div>
      <div class="chat-text ${m.error?'error':''}">${escapeHtml(m.text)}</div>
    </div>`).join('');
}

function renderTarjetas(){
  const cfg = state.config;
  const cards = (cfg.debt && cfg.debt.cards) || [];

  const totalSaldo = sum(cards.map(c=>({amount:c.saldo})));
  const totalAbono = sum(cards.map(c=>({amount:c.abonoMensual})));
  const interesMensualEstimado = cards.reduce((a,c)=> a + c.saldo*(c.tasaMensual/100), 0);
  // Solo cuenta tarjetas con límite cargado — mezclar con las que no lo tienen
  // (límite 0) daría un % de uso inflado y sin sentido.
  const cardsConLimite = cards.filter(c=>c.limite>0);
  const totalLimite = sum(cardsConLimite.map(c=>({amount:c.limite})));
  const totalSaldoConLimite = sum(cardsConLimite.map(c=>({amount:c.saldo})));
  const utilGlobal = totalLimite>0 ? totalSaldoConLimite/totalLimite : null;
  const prioridad = [...cards].filter(c=>c.saldo>0 && c.tasaMensual>0).sort((a,b)=>b.tasaMensual-a.tasaMensual)[0];

  const summary = `
    <div class="card">
      <h2>Resumen de deuda</h2>
      <div class="dials" style="grid-template-columns:repeat(3,1fr);">
        <div class="dial">
          <div class="amt num" style="font-size:18px;">${fmt(totalSaldo)}</div>
          <div class="label">Deuda total</div>
        </div>
        <div class="dial">
          <div class="amt num" style="font-size:18px;color:${interesMensualEstimado>0?'var(--danger)':'var(--text)'};">${fmt(interesMensualEstimado)}</div>
          <div class="label">Interés / mes</div>
        </div>
        <div class="dial">
          <div class="amt num" style="font-size:18px;">${fmt(totalAbono)}</div>
          <div class="label">Abono / mes</div>
        </div>
      </div>
      ${utilGlobal!==null ? `
      <div class="fuelrow" style="margin-top:14px;">
        <div class="top"><div class="name">Uso de crédito${cardsConLimite.length<cards.length?' (tarjetas con límite cargado)':''}</div><div class="figs">${Math.round(utilGlobal*100)}%</div></div>
        <div class="track"><div class="fill ${utilClass(utilGlobal)}" style="width:${Math.min(utilGlobal*100,100)}%"></div></div>
      </div>` : ''}
      ${prioridad ? `<div class="setup-note" style="margin:14px 0 0;">Si tienes dinero extra para meter a deudas, prioriza <b style="color:var(--text);">${escapeHtml(prioridad.name)}</b> — es la que más te cuesta cada mes (${prioridad.tasaMensual}% mensual).</div>` : ''}
    </div>`;

  const tiles = cards.length
    ? [...cards].sort((a,b)=>b.tasaMensual-a.tasaMensual).map(c=>renderCardTile(c)).join('')
    : `<div class="empty-state">Todavía no agregas ninguna tarjeta.</div>`;

  return `
    ${summary}
    <div class="card">
      <h2>Tus tarjetas</h2>
      ${tiles}
      ${!state.showCardForm ? `<button class="btn-ghost" id="card-add-open">+ Agregar tarjeta</button>` : ''}
    </div>
    ${state.showCardForm ? renderCardForm() : ''}
  `;
}

function computeWhatIf(card, extra){
  const baseline = simulatePayoff(card);
  const hipotetico = simulatePayoff({ ...card, abonoMensual: (card.abonoMensual||0) + extra });
  return { baseline, hipotetico };
}
function renderWhatIfResult(r){
  const { baseline, hipotetico } = r;
  if(hipotetico.neverPaysOff){
    return `<div class="setup-note" style="margin-top:8px;margin-bottom:0;">Con ese abono extra, tu abono sigue sin cubrir el interés — necesitas más para que baje el saldo.</div>`;
  }
  if(baseline.neverPaysOff){
    return `<div class="proj-explain" style="margin-top:8px;color:var(--ok);">Con ese abono extra sí la liquidas: ${hipotetico.months} mes${hipotetico.months===1?'':'es'}, pagando ~${fmt(hipotetico.totalInterest)} de interés (hoy nunca se liquidaría con tu abono actual).</div>`;
  }
  const monthsSaved = baseline.months - hipotetico.months;
  const interestSaved = baseline.totalInterest - hipotetico.totalInterest;
  return `<div class="proj-explain" style="margin-top:8px;color:var(--ok);">Terminarías ${monthsSaved} mes${monthsSaved===1?'':'es'} antes y te ahorrarías ~${fmt(interestSaved)} de interés.</div>`;
}

function renderCardTile(c){
  const util = c.limite>0 ? c.saldo/c.limite : null;
  const proximoCorte = nextOccurrenceOfDay(c.corteDia);
  const proximoPago = nextOccurrenceOfDay(c.pagoDia);
  const diasPago = daysUntil(proximoPago);
  const sim = simulatePayoff(c);

  let payoffText;
  if(c.saldo<=0){
    payoffText = 'Sin saldo pendiente ✓';
  } else if(sim.neverPaysOff){
    payoffText = c.abonoMensual<=0
      ? 'No tienes un abono mensual definido para esta tarjeta.'
      : `⚠️ Con tu abono actual (${fmt(c.abonoMensual)}/mes) nunca terminas de pagarla: el interés mensual (~${fmt(c.saldo*c.tasaMensual/100)}) es igual o mayor a tu abono.`;
  } else {
    const finish = addMonths(new Date(), sim.months);
    payoffText = `A este ritmo la terminas de pagar en ${sim.months} mes${sim.months===1?'':'es'} (${MESES[finish.getMonth()]} ${finish.getFullYear()}), pagando ~${fmt(sim.totalInterest)} de interés en el camino.`;
  }

  const pagoBadge = diasPago!==null && c.saldo>0
    ? `<span style="color:${diasPago<=5?'var(--danger)':diasPago<=10?'var(--warn)':'var(--muted)'};">Pago en ${diasPago<=0?'hoy':diasPago+'d'}</span>`
    : '';
  const corteBadge = proximoCorte ? `Corte: ${proximoCorte.getDate()} ${MESES[proximoCorte.getMonth()].slice(0,3)}` : '';

  const cycle = cardCycleRange(c);
  const cycleGastos = cardCycleGastos(c);
  const cycleSpend = sum(cycleGastos);
  const cyclePct = c.limite>0 ? cycleSpend/c.limite : null;

  const isExpanded = state.expandedCard === c.id;
  const payments = state.cardPayments.filter(p=>p.cardId===c.id).slice(0,5);

  return `
    <div class="card-tile">
      <div class="card-tile-top">
        <div>
          <div class="card-tile-name">${escapeHtml(c.name)}${c.last4 ? ` <span class="card-tile-last4">•••• ${escapeHtml(c.last4)}</span>` : ''}</div>
          ${c.bank ? `<div class="card-tile-bank">${escapeHtml(c.bank)}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="amt num" style="font-size:16px;">${fmt(c.saldo)}</div>
          ${c.limite>0 ? `<div class="meta" style="font-size:11px;color:var(--muted);">de ${fmt(c.limite)}</div>` : ''}
        </div>
      </div>

      ${util!==null ? `
        <div class="track" style="margin-top:10px;"><div class="fill ${utilClass(util)}" style="width:${Math.min(util*100,100)}%"></div></div>
        <div class="meta" style="font-size:11px;color:var(--muted);margin-top:4px;">${Math.round(util*100)}% de uso</div>
      ` : `<div class="setup-note" style="margin:8px 0 0;">Agrega el límite de crédito (Editar) para ver tu % de uso.</div>`}

      <div class="card-tile-meta">
        <span>Tasa: ${c.tasaMensual}%/mes</span>
        <span>Abono: ${fmt(c.abonoMensual)}/mes</span>
        ${c.pagoMinimo>0 ? `<span>Pago mínimo: ${fmt(c.pagoMinimo)}</span>` : ''}
        ${corteBadge ? `<span>${corteBadge}</span>` : ''}
        ${pagoBadge}
      </div>

      <div class="fuelrow" style="margin-top:12px;">
        <div class="top">
          <div class="name">🧾 Gastado en este ciclo${cycle.usesCalendarFallback ? ' (mes, sin corte configurado)' : ''}</div>
          <div class="figs num">${fmt(cycleSpend)}</div>
        </div>
        ${cyclePct!==null ? `<div class="track"><div class="fill ${utilClass(cyclePct)}" style="width:${Math.min(cyclePct*100,100)}%"></div></div>` : ''}
      </div>

      <div class="proj-explain" style="margin-top:8px;">${payoffText}</div>

      <div class="card-tile-pay">
        <input type="number" inputmode="decimal" placeholder="Monto del pago" id="pay-amount-${c.id}">
        <button class="btn-ghost" data-pay-card="${c.id}">Registrar pago</button>
      </div>

      <div class="proj-actions">
        <button class="btn-ghost" data-card-edit="${c.id}">Editar</button>
        <button class="btn-ghost" data-card-history="${c.id}">${isExpanded ? 'Ocultar detalle' : 'Ver detalle'}</button>
        <button class="btn-ghost" data-card-del="${c.id}" style="color:var(--danger);">Eliminar</button>
      </div>

      ${isExpanded ? `
        <div class="divider"></div>
        <div class="small-label">Gastos de este ciclo (con esta tarjeta)</div>
        ${cycleGastos.length ? cycleGastos.map(e=>`
          <div class="hist-item">
            <div><div>${escapeHtml(e.note) || escapeHtml(catName(e.category))}</div><div class="meta">${e.date}${e.category?' · '+escapeHtml(catName(e.category)):''}</div></div>
            <div class="amt gasto">${fmt(e.amount)}</div>
          </div>`).join('') : `<div class="empty-state" style="padding:10px 0;">Sin gastos con esta tarjeta en el ciclo actual.</div>`}
        <div class="small-label" style="margin-top:14px;">Pagos recientes</div>
        ${payments.length ? payments.map(p=>`
          <div class="hist-item">
            <div><div>Pago</div><div class="meta">${p.date}${p.note?' · '+escapeHtml(p.note):''}</div></div>
            <div class="amt ahorro">${fmt(p.amount)}</div>
          </div>`).join('') : `<div class="empty-state" style="padding:10px 0;">Sin pagos registrados todavía.</div>`}
      ` : ''}

      ${c.saldo>0 ? `
      <div class="divider"></div>
      <div class="small-label">¿Y si pago extra cada mes?</div>
      <div class="card-tile-pay">
        <input type="number" inputmode="decimal" placeholder="Abono extra al mes" id="whatif-amount-${c.id}" value="${(state.cardWhatIf[c.id]&&state.cardWhatIf[c.id].extra)||''}">
        <button class="btn-ghost" data-whatif-card="${c.id}">Calcular</button>
      </div>
      ${state.cardWhatIf[c.id] && state.cardWhatIf[c.id].result ? renderWhatIfResult(state.cardWhatIf[c.id].result) : ''}
      ` : ''}
    </div>`;
}

function investmentTotals(inv){
  const months = investmentMonthsElapsed(inv);
  const totalAportado = (inv.montoInicial||0) + (inv.aportacionMensual||0)*months;
  const valorActual = estimateInvestmentValue(inv);
  const rendimiento = valorActual - totalAportado;
  return { months, totalAportado, valorActual, rendimiento };
}

function renderInversion(){
  const cfg = state.config;
  const invs = cfg.investments || [];
  let totalAportadoAll = 0, valorActualAll = 0;
  invs.forEach(inv=>{
    const t = investmentTotals(inv);
    totalAportadoAll += t.totalAportado;
    valorActualAll += t.valorActual;
  });
  const rendimientoAll = valorActualAll - totalAportadoAll;

  const summary = `
    <div class="card">
      <h2>Resumen de inversión</h2>
      <div class="dials" style="grid-template-columns:repeat(3,1fr);">
        <div class="dial">
          <div class="amt num" style="font-size:18px;">${fmt(totalAportadoAll)}</div>
          <div class="label">Total aportado</div>
        </div>
        <div class="dial">
          <div class="amt num" style="font-size:18px;">${fmt(valorActualAll)}</div>
          <div class="label">Valor estimado</div>
        </div>
        <div class="dial">
          <div class="amt num" style="font-size:18px;color:${rendimientoAll>=0?'var(--ok)':'var(--danger)'};">${rendimientoAll>=0?'+':''}${fmt(rendimientoAll)}</div>
          <div class="label">Rendimiento est.</div>
        </div>
      </div>
      <div class="setup-note" style="margin:14px 0 0;">Estimación con interés compuesto simple sobre la tasa anual que capturaste — no considera comisiones, impuestos ni que la tasa real varíe mes a mes.</div>
    </div>`;

  const tiles = invs.length
    ? invs.map(inv=>renderInvestmentTile(inv)).join('')
    : `<div class="empty-state">Todavía no agregas ninguna inversión.</div>`;

  return `
    ${summary}
    <div class="card">
      <h2>Tus inversiones</h2>
      ${tiles}
      ${!state.showInvestmentForm ? `<button class="btn-ghost" id="inv-add-open">+ Agregar inversión</button>` : ''}
    </div>
    ${state.showInvestmentForm ? renderInvestmentForm() : ''}
  `;
}

  const t = investmentTotals(inv);
  const proy12 = estimateInvestmentValue(inv, 12);
  const proy24 = estimateInvestmentValue(inv, 24);
  const proy60 = estimateInvestmentValue(inv, 60);
  return `
    <div class="card-tile">
      <div class="card-tile-top">
        <div>
          <div class="card-tile-name">${escapeHtml(inv.name)}</div>
          ${inv.type ? `<div class="card-tile-bank">${escapeHtml(inv.type)}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="amt num" style="font-size:16px;">${fmt(t.valorActual)}</div>
          <div class="meta" style="font-size:11px;color:${t.rendimiento>=0?'var(--ok)':'var(--danger)'};">${t.rendimiento>=0?'+':''}${fmt(t.rendimiento)} vs aportado</div>
        </div>

/* ---------- importar movimientos desde Excel/CSV ---------- */
function findCol(headers, patterns){
  return headers.find(h=> patterns.some(p=> p.test(String(h))));
}
function parseExcelDate(val){
  if(val instanceof Date && !isNaN(val)){
    return val.getFullYear()+'-'+String(val.getMonth()+1).padStart(2,'0')+'-'+String(val.getDate()).padStart(2,'0');
  }
  if(typeof val === 'number' && window.XLSX && XLSX.SSF){
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  if(typeof val === 'string'){
    const s = val.trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m){
      let a=+m[1], b=+m[2], y=m[3];
      let day, month;
      if(a>12){ day=a; month=b; } else if(b>12){ day=b; month=a; } else { day=a; month=b; } // DD/MM/AAAA por default (convención MX)
      return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }
    const d2 = new Date(s);
    if(!isNaN(d2)) return d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
  }
  return null;
}
function parseImportedRows(rows){
  if(!rows || !rows.length){
    return { valid: [], errors: [{ row:0, reason:'El archivo está vacío o no tiene encabezados.' }] };
  }
  const headers = Object.keys(rows[0]);
  const col = {
    fecha: findCol(headers, [/fecha/i, /^date$/i]),
    tipo: findCol(headers, [/^tipo$/i, /^type$/i]),
    categoria: findCol(headers, [/categor/i]),
    metodo: findCol(headers, [/m[eé]todo/i, /tarjeta/i, /forma de pago/i]),
    monto: findCol(headers, [/monto/i, /amount/i, /cantidad/i, /importe/i]),
    nota: findCol(headers, [/nota/i, /concepto/i, /descripci[oó]n/i, /^note$/i]),
    fuente: findCol(headers, [/fuente/i, /^source$/i]),
  };
  if(!col.fecha || !col.monto){
    return { valid: [], errors: [{ row:0, reason:'No encontré columnas de Fecha y Monto — revisa los encabezados de tu archivo (puedes basarte en el CSV que exportas desde aquí).' }] };
  }
  const cfg = state.config;
  const valid = [], errors = [];
  rows.forEach((row,i)=>{
    const fecha = parseExcelDate(row[col.fecha]);
    const montoRaw = row[col.monto];
    const monto = typeof montoRaw==='number' ? montoRaw : parseFloat(String(montoRaw||'').replace(/[^0-9.-]/g,''));
    if(!fecha || !monto || monto<=0){
      errors.push({ row:i+2, reason: !fecha ? 'Fecha inválida' : 'Monto inválido' });
      return;
    }
    let tipo = 'gasto';
    if(col.tipo){
      const t = String(row[col.tipo]||'').toLowerCase();
      if(/ingreso|income/.test(t)) tipo = 'ingreso';
      else if(/ahorro|saving/.test(t)) tipo = 'ahorro';
      else if(/gasto|expense|egreso/.test(t)) tipo = 'gasto';
    }
    let category = null, metodoPago = null, fuente = null, subtype = null, metaNombre = '';
    if(tipo==='gasto'){
      const catRaw = col.categoria ? String(row[col.categoria]||'').trim().toLowerCase() : '';
      const fx = cfg.fixedExpenses.find(c=>c.name.toLowerCase()===catRaw || c.id===catRaw);
      category = fx ? fx.id : (/^diversi/.test(catRaw) ? 'diversion' : 'otro');
      const metRaw = col.metodo ? String(row[col.metodo]||'').trim().toLowerCase() : '';
      if(metRaw && !/efectivo|d[eé]bito|cash/.test(metRaw)){
        const card = cfg.debt.cards.find(c=> c.name.toLowerCase()===metRaw || (c.last4 && metRaw.includes(c.last4)));
        metodoPago = card ? card.id : null;
      }
    } else if(tipo==='ingreso'){
      const fRaw = col.fuente ? String(row[col.fuente]||'').trim().toLowerCase() : '';
      const fx2 = FUENTES_INGRESO.find(f=> f.label.toLowerCase()===fRaw || f.id===fRaw);
      fuente = fx2 ? fx2.id : 'otro';
    } else if(tipo==='ahorro'){
      subtype = 'proposito';
    }
    const nota = col.nota ? String(row[col.nota]||'').trim() : '';
    valid.push({ id: uid(), type: tipo, category, amount: Math.round(monto*100)/100, note: nota, date: fecha, fuente, subtype, metaNombre, metodoPago });
  });
  return { valid, errors };
}
async function bulkImportEntriesPersist(entries){
  if(isCloud()){
    const userId = state.session.user.id;
    const rows = entries.map(e=>({
      id:e.id, user_id:userId, type:e.type, category:e.category, amount:e.amount, note:e.note, date:e.date,
      subtype:e.subtype||null, meta_nombre:e.metaNombre||null, fuente:e.fuente||null, metodo_pago:e.metodoPago||null,
    }));
    for(let i=0;i<rows.length;i+=500){
      const { error } = await supa.from('entries').insert(rows.slice(i,i+500));
      if(error) return false;
    }
    state.entries.push(...entries);
  } else {
    state.entries.push(...entries);
    await persistEntriesLocal();
  }
  return true;
}

function toCSV(){
  const rows = [['fecha','tipo','categoria','metodo_pago','monto','nota']];
  [...state.entries].sort((a,b)=> a.date.localeCompare(b.date)).forEach(e=>{
    rows.push([e.date, e.type, e.type==='gasto'? catName(e.category):'', metodoPagoLabel(e.metodoPago)||'', e.amount, (e.note||'').replace(/,/g,';')]);
  });
  return rows.map(r=>r.join(',')).join('\n');
}

function attachHandlers(){

    });

      const fuente = type==='ingreso' ? document.getElementById('f-fuente').value : null;
